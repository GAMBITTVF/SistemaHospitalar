{% with mensagens = get_flashed_messages(with_categories=true) %}
  {% if mensagens %}
  <div class="mensagens">
    {% for categoria, texto in mensagens %}
      <div class="mensagem {{ categoria if categoria in ('sucesso', 'erro', 'aviso', 'info') else 'info' }}">{{ texto }}</div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
